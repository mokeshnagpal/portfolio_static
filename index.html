<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio website with projects, experience, achievements, research, and contact links.">
  <meta name="theme-color" content="#0f766e">
  <title>Portfolio</title>
  <script>
    (() => {
      const key = "portfolio-theme";
      const cookieTheme = document.cookie
        .split("; ")
        .find((row) => row.startsWith(`${key}=`))
        ?.split("=")[1];
      let theme = "dark";
      try {
        theme = localStorage.getItem(key) || cookieTheme || "dark";
      } catch (error) {
        theme = cookieTheme || "dark";
      }
      const safeTheme = theme === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = safeTheme;
      document.documentElement.style.colorScheme = safeTheme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content", safeTheme === "light" ? "#0f766e" : "#08111f");
    })();
  </script>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="apple-touch-icon" sizes="180x180" href="public/logo/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="public/logo/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="public/logo/favicon-16x16.png">
  <link rel="manifest" href="public/logo/site.webmanifest">
  <link href="public/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="src/css/site.css" rel="stylesheet">
</head>
<body>
  <div id="root"></div>

  <script src="public/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="src/js/components.js"></script>
  <script src="src/js/app.runtime.js"></script>
</body>
</html>
